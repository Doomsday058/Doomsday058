<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Владислав Фёдоров – аналитик-разработчик: данные и прикладной AI">
  <style>
    .mono { font-family: Consolas, "DejaVu Sans Mono", "Liberation Mono", Menlo, monospace; }
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .dim { fill: #6e7681; }
    .node { fill: #0d1117; stroke: #2b8a93; stroke-width: 1.5; }
    .node-llm { fill: #0d1117; stroke: #8e6bd8; stroke-width: 1.5; }
    .label { fill: #c9d1d9; font-size: 13px; }
    .edge { fill: none; stroke: #2f3a44; stroke-width: 1.5; }
    .retry { fill: none; stroke: #56d4dd; stroke-width: 1.3; stroke-dasharray: 5 4; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -18; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="300" rx="6" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="6" fill="none" stroke="#21262d"/>

  <!-- верхняя панель -->
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#21262d"/>
  <text x="48" y="31" class="mono dim" font-size="14">doomsdayoff · main</text>
  <circle cx="1046" cy="26" r="4" fill="#3fb950" class="pulse"/>
  <text x="1152" y="31" class="mono dim" font-size="14" text-anchor="end">open to work</text>

  <!-- нижняя панель -->
  <line x1="0" y1="252" x2="1200" y2="252" stroke="#21262d"/>
  <line x1="40" y1="48" x2="40" y2="252" stroke="#21262d"/>
  <text x="80" y="281" class="mono dim" font-size="13">Санкт-Петербург · ТУСУР · English C1</text>
  <text x="1152" y="281" class="mono dim" font-size="13" text-anchor="end">v2026.09</text>

  <!-- левая часть -->
  <text x="80" y="132" class="sans" font-size="54" font-weight="600" fill="#e6edf3">Владислав Фёдоров</text>
  <text x="82" y="172" class="sans" font-size="15" textLength="640" lengthAdjust="spacing" fill="#56d4dd">АНАЛИТИК-РАЗРАБОТЧИК · АВТОМАТИЗАЦИЯ · ДАННЫЕ · ПРИКЛАДНОЙ AI</text>
  <text x="82" y="210" class="mono" font-size="14" fill="#7d8b96">SQL · Python · BPMN · OpenAPI · LLM-оркестрация</text>

  <!-- правая часть: процесс, где модель предлагает, а система проверяет -->
  <line x1="760" y1="48" x2="760" y2="252" stroke="#21262d"/>

  <path class="edge" d="M801 150 H816"/>
  <path class="edge" d="M896 150 H910"/>
  <path class="edge" d="M924 136 V102 H956"/>
  <path class="edge" d="M924 164 V198 H956"/>
  <path class="edge" d="M1036 102 H1050 V150 H1064"/>
  <path class="edge" d="M1036 198 H1050 V150"/>
  <path class="edge" d="M1144 150 H1161"/>
  <path class="retry" d="M1104 132 V72 H996 V86"/>
  <text x="1050" y="66" class="mono" font-size="11" fill="#56d4dd" text-anchor="middle">повтор</text>

  <circle cx="792" cy="150" r="9" fill="#0d1117" stroke="#2b8a93" stroke-width="1.5"/>
  <rect x="816" y="132" width="80" height="36" rx="5" class="node"/>
  <text x="856" y="155" class="mono label" text-anchor="middle">данные</text>
  <path d="M924 136 L938 150 L924 164 L910 150 Z" class="node"/>
  <rect x="956" y="86" width="80" height="32" rx="5" class="node-llm"/>
  <text x="996" y="107" class="mono label" text-anchor="middle">LLM</text>
  <rect x="956" y="182" width="80" height="32" rx="5" class="node"/>
  <text x="996" y="203" class="mono label" text-anchor="middle">правила</text>
  <rect x="1064" y="132" width="80" height="36" rx="5" class="node"/>
  <text x="1104" y="155" class="mono label" text-anchor="middle">схема ✓</text>
  <circle cx="1170" cy="150" r="9" fill="#0d1117" stroke="#56d4dd" stroke-width="3"/>

  <circle r="4" fill="#56d4dd">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M792 150 H924 V102 H1050 V150 H1170"/>
  </circle>
  <circle r="3" fill="#8e6bd8" opacity="0.8" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="2.5s"/>
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"
      path="M792 150 H924 V198 H1050 V150 H1170"/>
  </circle>
</svg>
